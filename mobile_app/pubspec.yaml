name: driver_safety_app
description: A Flutter application for driver safety monitoring.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+5
  web_socket_channel: ^2.4.0
  audioplayers: ^5.2.1
  image: ^4.1.3
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  google_maps_flutter: ^2.2.3
  geolocator: ^10.1.0
  http: ^1.1.0
  shared_preferences: ^2.2.2
  fl_chart: ^0.66.0
  url_launcher: ^6.2.1
  permission_handler: ^11.0.1
  flutter_phone_direct_caller: ^2.1.1
  sensors_plus: ^4.0.2
  cupertino_icons: ^1.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/sounds/
    - assets/logo.jpg
    - assets/logo.png
    - assets/haniny_green.png
    - assets/haniny_orange.png
    - assets/haniny_bg.jpg
    - assets/haniny_last.jpg